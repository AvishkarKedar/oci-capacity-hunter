name: 24/7 OCI Capacity Hunter

on:
  schedule:
    # Run every 5 hours as a standing cron backup / safety net
    - cron: '0 */5 * * *'
  workflow_dispatch:

concurrency:
  group: oci-hunter
  cancel-in-progress: false

jobs:
  hunt:
    name: OCI A1 Capacity Hunter (5.5-Hour Cycle)
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 6-hour execution limit on standard runner
    permissions:
      issues: write
      contents: write
      actions: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Configure OCI Credentials
        env:
          OCI_CONFIG: ${{ secrets.OCI_CONFIG_FILE }}
          OCI_KEY: ${{ secrets.OCI_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          echo "$OCI_CONFIG" > ~/.oci/config
          echo "$OCI_KEY" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/config ~/.oci/oci_api_key.pem

      - name: Run 24/7 Capacity Hunter
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          AVAILABILITY_DOMAIN: ${{ secrets.AVAILABILITY_DOMAIN }}
          BOOT_VOLUME_ID: ${{ secrets.BOOT_VOLUME_ID }}
          SUBNET_ID: ${{ secrets.SUBNET_ID }}
          INSTANCE_NAME: ${{ secrets.INSTANCE_NAME }}
          OCPU_COUNT: ${{ secrets.OCPU_COUNT }}
          MEMORY_GB: ${{ secrets.MEMORY_GB }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          python hunter.py

      - name: Seamless 24/7 Chaining (Trigger Next Cycle)
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f instance_info.json ]; then
            echo "Instance successfully provisioned. Stopping 24/7 hunting chain."
            exit 0
          fi
          # Check active runs to avoid duplicate scheduling
          RUNNING_RUNS=$(gh run list --workflow=hunt.yml --status=in_progress --json databaseId -q '. | length')
          if [ "$RUNNING_RUNS" -le 1 ]; then
            echo "Cycle completed without capacity. Triggering next 5.5-hour hunting cycle..."
            gh workflow run hunt.yml || true
          else
            echo "Another run is already active or in progress ($RUNNING_RUNS). Skipping dispatch."
          fi
